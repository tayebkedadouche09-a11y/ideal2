name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: companyos
          POSTGRES_PASSWORD: companyos
          POSTGRES_DB: companyos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U companyos -d companyos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://companyos:companyos@localhost:5432/companyos
      JWT_ACCESS_SECRET: ci-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-production
      WEB_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:api
      - run: npm run typecheck:web
      - run: npm run build
      - name: Apply migrations
        run: node scripts/migrate.mjs
      - run: npm test
      - name: E2E multi-tenant tests
        run: npm run test:e2e -w @company-os/api
