name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: companyos
          POSTGRES_PASSWORD: companyos
          POSTGRES_DB: companyos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U companyos -d companyos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:api
      - run: npm run typecheck:web
      - run: npm run build
      - run: npm test
        env:
          DATABASE_URL: postgres://companyos:companyos@localhost:5432/companyos
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgres://companyos:companyos@localhost:5432/companyos
      - run: npm run test:e2e -w @company-os/api
        env:
          DATABASE_URL: postgres://companyos:companyos@localhost:5432/companyos
          JWT_ACCESS_SECRET: e2e-access-secret
          JWT_REFRESH_SECRET: e2e-refresh-secret
